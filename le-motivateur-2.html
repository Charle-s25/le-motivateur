<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Motivateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400;1,9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECE7DC;
    --card:#FBF9F4;
    --ink:#242220;
    --ink-soft:#5B564E;
    --wine:#7A3243;
    --wine-soft:#a9788b;
    --line:#D9D2C2;
  }

  *{ box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:6vh 5vw;
    transition:background-color 0.7s ease, color 0.7s ease;
  }

  body, .card, h1, blockquote, .attribution, .context, .eyebrow-top,
  .card-eyebrow, .subtitle, .counter, .copy-hint,
  button.generate, .divider{
    transition:background-color 0.7s ease, color 0.7s ease, border-color 0.7s ease;
  }

  header{
    text-align:center;
    margin-bottom:clamp(2.5rem, 6vh, 4rem);
  }

  .eyebrow-top{
    font-size:0.7rem;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--wine);
    margin:0 0 0.9rem;
    font-weight:600;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(2rem, 5vw, 3.2rem);
    margin:0 0 0.6rem;
    letter-spacing:-0.01em;
  }

  .subtitle{
    font-size:0.95rem;
    color:var(--ink-soft);
    max-width:36ch;
    margin:0 auto;
    line-height:1.5;
    font-style:italic;
    font-family:'Fraunces', serif;
  }

  main{
    width:100%;
    max-width:620px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .card{
    position:relative;
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:clamp(2.2rem, 6vw, 3.6rem) clamp(1.8rem, 6vw, 3.2rem) clamp(1.8rem, 5vw, 2.6rem);
    box-shadow:0 1px 2px rgba(36,34,32,0.04), 0 18px 40px -22px rgba(36,34,32,0.35);
    opacity:0;
    transform:translateY(10px);
    transition:opacity 0.55s ease, transform 0.55s ease;
  }

  .card.visible{
    opacity:1;
    transform:translateY(0);
  }

  .card-eyebrow{
    font-size:0.68rem;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--wine);
    font-weight:600;
    margin:0 0 1.4rem;
    display:flex;
    align-items:center;
    gap:0.6rem;
  }

  .card-eyebrow::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }

  .quote-mark{
    font-family:'Fraunces', serif;
    font-size:3rem;
    line-height:0.5;
    color:var(--wine-soft);
    display:block;
    margin-bottom:0.6rem;
    opacity:0.55;
  }

  blockquote{
    margin:0;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.35rem, 3.4vw, 1.75rem);
    line-height:1.42;
    color:var(--ink);
  }

  .attribution{
    margin:1.3rem 0 0;
    font-family:'Work Sans', sans-serif;
    font-size:0.85rem;
    font-weight:500;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }

  .attribution::before{
    content:'— ';
  }

  .divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:1.7rem 0 1.3rem;
  }

  .context-label{
    font-size:0.64rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--wine-soft);
    font-weight:600;
    margin:0 0 0.5rem;
  }

  .context{
    margin:0;
    font-size:0.92rem;
    line-height:1.55;
    color:var(--ink-soft);
    font-style:italic;
  }

  .controls{
    margin-top:2.4rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.9rem;
  }

  button.generate{
    font-family:'Work Sans', sans-serif;
    font-size:0.85rem;
    font-weight:600;
    letter-spacing:0.03em;
    color:var(--card);
    background:var(--ink);
    border:none;
    padding:0.95rem 2.2rem;
    border-radius:2px;
    cursor:pointer;
    transition:background 0.25s ease, transform 0.15s ease;
  }

  button.generate:hover{
    background:var(--wine);
  }

  button.generate:active{
    transform:scale(0.97);
  }

  button.generate:focus-visible{
    outline:2px solid var(--wine);
    outline-offset:3px;
  }

  .counter{
    font-family:'Fraunces', serif;
    font-variant-numeric:tabular-nums;
    font-size:0.78rem;
    color:var(--ink-soft);
    letter-spacing:0.05em;
  }

  .secondary-actions{
    display:flex;
    align-items:center;
    gap:0.6rem;
  }

  .dot-sep{
    color:var(--line);
    font-size:0.72rem;
  }

  .copy-hint{
    font-size:0.72rem;
    color:var(--ink-soft);
    opacity:0.7;
    background:none;
    border:none;
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    padding:0.2rem;
  }

  .copy-hint:focus-visible{
    outline:2px solid var(--wine);
    outline-offset:2px;
  }

  footer{
    margin-top:3rem;
    font-size:0.68rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    opacity:0.55;
  }

  @media (prefers-reduced-motion: reduce){
    .card, html{ transition:none; scroll-behavior:auto; }
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow-top">Cabinet des pensées profondes</p>
  <h1>Le Motivateur</h1>
  <p class="subtitle">De vraies citations. De vrais proverbes. Des circonstances qui, elles, le sont beaucoup moins.</p>
</header>

<main>
  <div class="card" id="card">
    <p class="card-eyebrow" id="category">Citation</p>
    <span class="quote-mark">“</span>
    <blockquote id="quote">Chargement d'une pensée…</blockquote>
    <p class="attribution" id="author">—</p>
    <hr class="divider">
    <p class="context-label">Contexte réel</p>
    <p class="context" id="context">…</p>
  </div>

  <div class="controls">
    <button class="generate" id="generateBtn">Générer une pensée</button>
    <div class="secondary-actions">
      <button class="copy-hint" id="copyBtn">Copier le texte</button>
      <span class="dot-sep">·</span>
      <button class="copy-hint" id="shareBtn">Partager en image</button>
      <span class="dot-sep">·</span>
      <button class="copy-hint" id="bgPhotoBtn">Utiliser ma photo</button>
    </div>
    <input type="file" accept="image/*" id="bgPhotoInput" hidden>
    <p class="counter" id="counter">Pensée n° 000</p>
  </div>
</main>

<footer>Aucune de ces personnes n'a validé le contexte</footer>

const MOODS = [
  { paper:"#ECE7DC", card:"#FBF9F4", ink:"#242220", inkSoft:"#5B564E", wine:"#7A3243", wineSoft:"#A9788B", line:"#D9D2C2" }, // Porcelaine
  { paper:"#E3E7DE", card:"#F7F8F3", ink:"#202B22", inkSoft:"#55614F", wine:"#3F5B4E", wineSoft:"#83A08F", line:"#CBD3C4" }, // Sauge
  { paper:"#EFE6E6", card:"#FBF4F4", ink:"#2B1F24", inkSoft:"#6B5158", wine:"#6B3350", wineSoft:"#A97690", line:"#DFC9CE" }, // Prune
  { paper:"#E4E6EC", card:"#F6F7FA", ink:"#1F2430", inkSoft:"#545B6B", wine:"#33415C", wineSoft:"#7C89A3", line:"#CBD0DC" }, // Bleu nuit doux
  { paper:"#EFE6DA", card:"#FBF6EE", ink:"#2E2418", inkSoft:"#6B5C48", wine:"#8A5A34", wineSoft:"#C39A72", line:"#E1D2BC" }, // Terre cuite

];

let lastMood = -1;

function applyMood(){
  let i;
  do {
    i = Math.floor(Math.random() * MOODS.length);
  } while (i === lastMood && MOODS.length > 1);
  lastMood = i;
  const m = MOODS[i];
  const root = document.documentElement.style;
  root.setProperty('--paper', m.paper);
  root.setProperty('--card', m.card);
  root.setProperty('--ink', m.ink);
  root.setProperty('--ink-soft', m.inkSoft);
  root.setProperty('--wine', m.wine);
  root.setProperty('--wine-soft', m.wineSoft);
  root.setProperty('--line', m.line);
}

const shareBtn = document.getElementById('shareBtn');

let lastIndex = -1;
let count = 0;

function pad(n){ return String(n).padStart(3, '0'); }

function pickThought(){
  let i;
  do {
    i = Math.floor(Math.random() * THOUGHTS.length);
  } while (i === lastIndex && THOUGHTS.length > 1);
  lastIndex = i;
  return THOUGHTS[i];
}

function render(thought){
  catEl.textContent = thought.cat;
  quoteEl.textContent = thought.quote;
  authorEl.textContent = thought.author;
  contextEl.textContent = thought.context;
  count += 1;
  counterEl.textContent = `Pensée n° ${pad(count)}`;
}

function showNext(){
  const thought = pickThought();
  applyMood();
  card.classList.remove('visible');
  window.setTimeout(() => {
    render(thought);
    card.classList.add('visible');
  }, 220);
}

generateBtn.addEventListener('click', showNext);

copyBtn.addEventListener('click', async () => {
  const text = `« ${quoteEl.textContent} »\n— ${authorEl.textContent}\n\nContexte réel : ${contextEl.textContent}`;
  try {
    await navigator.clipboard.writeText(text);
    const original = copyBtn.textContent;
    copyBtn.textContent = 'Copié !';
    window.setTimeout(() => { copyBtn.textContent = original; }, 1600);
  } catch (e) {
    copyBtn.textContent = 'Copie indisponible';
  }
});

function wrapLines(ctx, text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let current = '';
  words.forEach(word => {
    const test = current ? current + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && current){
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  });
  if (current) lines.push(current);
  return lines;
}

function spaced(str, gap){
  return str.toUpperCase().split('').join(String.fromCharCode(8202).repeat(gap));
}

const SCENES = [
  // Aube porcelaine
  { sky:['#F3E4D2','#F0C9A8','#E7A67E'], horizonY:0.62, sun:{color:'#FFF3DE', glow:'rgba(255,230,190,0.55)'}, hills:['#C98A63','#A9633F','#7A3F2B'] },
  // Sauge / forêt

function drawCover(ctx, img, x, y, w, h){
  const iw = img.width, ih = img.height;
  const scale = Math.max(w / iw, h / ih);
  const dw = iw * scale, dh = ih * scale;
  const dx = x + (w - dw) / 2, dy = y + (h - dh) / 2;
  ctx.drawImage(img, dx, dy, dw, dh);
}

function drawIllustratedScene(ctx, W, H, scene){
  const sky = ctx.createLinearGradient(0, 0, 0, H * scene.horizonY);
  sky.addColorStop(0, scene.sky[0]);
  sky.addColorStop(0.55, scene.sky[1]);
  sky.addColorStop(1, scene.sky[2]);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H * scene.horizonY);

  // sol / mer sous l'horizon
  ctx.fillStyle = scene.hills[2];
  ctx.fillRect(0, H * scene.horizonY, W, H - H * scene.horizonY);

  // soleil ou lune
  const body = scene.sun || scene.moon;
  const bx = W * 0.72, by = H * scene.horizonY * 0.78, br = W * 0.16;
  const glow = ctx.createRadialGradient(bx, by, 0, bx, by, br * 2.4);
  glow.addColorStop(0, body.glow);
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H * scene.horizonY);
  ctx.beginPath();
  ctx.arc(bx, by, br, 0, Math.PI * 2);
  ctx.fillStyle = body.color;
  ctx.fill();

  if (scene.moon){
    // étoiles
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    let seed = 42;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    for (let i = 0; i < 70; i++){
      const sx = rnd() * W, sy = rnd() * H * scene.horizonY * 0.9;
      const r = rnd() * 1.6 + 0.4;
      ctx.globalAlpha = rnd() * 0.7 + 0.3;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // reliefs / silhouettes en couches
  const layers = [
    { color: scene.hills[0], base: scene.horizonY - 0.05, amp: 0.05 },
    { color: scene.hills[1], base: scene.horizonY - 0.02, amp: 0.07 },
  ];
  layers.forEach((layer, li) => {
    ctx.fillStyle = layer.color;
    ctx.beginPath();
    ctx.moveTo(0, H);
    const points = 6;
    for (let i = 0; i <= points; i++){
      const px = (W / points) * i;
      const wobble = Math.sin(i * 1.7 + li * 2) * layer.amp;
      const py = H * (layer.base + wobble * 0.5);
      ctx.lineTo(px, py);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  });

  // reflet sur l'eau/sol
  const reflect = ctx.createLinearGradient(0, H * scene.horizonY, 0, H);
  reflect.addColorStop(0, 'rgba(255,255,255,0.10)');
  reflect.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = reflect;
  ctx.fillRect(0, H * scene.horizonY, W, (H - H * scene.horizonY) * 0.5);
}

function wrapLinesUpper(ctx, text, maxWidth){
  return wrapLines(ctx, text, maxWidth);
}

async function buildShareImage(){
  const W = 1080, H = 1350;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const sceneIndex = lastMood >= 0 ? lastMood : 0;

  if (customBgBitmap){
    drawCover(ctx, customBgBitmap, 0, 0, W, H);
  } else {
    drawIllustratedScene(ctx, W, H, SCENES[sceneIndex]);
  }

  // voile sombre haut et bas pour la lisibilité du texte
  const topScrim = ctx.createLinearGradient(0, 0, 0, H * 0.42);
  topScrim.addColorStop(0, 'rgba(10,8,6,0.55)');
  topScrim.addColorStop(1, 'rgba(10,8,6,0)');
  ctx.fillStyle = topScrim;
  ctx.fillRect(0, 0, W, H * 0.42);

  const bottomScrim = ctx.createLinearGradient(0, H * 0.62, 0, H);
  bottomScrim.addColorStop(0, 'rgba(8,7,6,0)');
  bottomScrim.addColorStop(1, 'rgba(8,7,6,0.72)');
  ctx.fillStyle = bottomScrim;
  ctx.fillRect(0, H * 0.62, W, H * 0.38);

  const marginX = 88;
  const innerW = W - marginX * 2;
  ctx.textBaseline = 'alphabetic';

  // eyebrow
  let y = 150;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = "600 22px 'Work Sans', sans-serif";
  ctx.fillText(spaced(catEl.textContent, 3), marginX, y);

  // citation
  y += 70;
  ctx.fillStyle = '#FBF9F4';
  ctx.font = "italic 500 56px 'Fraunces', serif";
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = 18;
  const quoteLines = wrapLinesUpper(ctx, quoteEl.textContent, innerW);
  quoteLines.forEach(l => { y += 66; ctx.fillText(l, marginX, y); });
  ctx.shadowBlur = 0;

  // auteur
  y += 54;
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.font = "500 28px 'Work Sans', sans-serif";
  ctx.fillText('— ' + authorEl.textContent, marginX, y);

  // bandeau contexte, en bas
  const ctxLabelY = H - 250;
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.font = "600 18px 'Work Sans', sans-serif";
  ctx.fillText(spaced('Contexte réel', 2), marginX, ctxLabelY);

  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.font = "italic 400 26px 'Fraunces', serif";
  let cy = ctxLabelY;
  const contextLines = wrapLinesUpper(ctx, contextEl.textContent, innerW - 140);
  contextLines.forEach(l => { cy += 36; ctx.fillText(l, marginX, cy); });

  // logo / filigrane bas droite, façon monogramme
  const cx = W - 120, cyLogo = H - 100, r = 34;
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cyLogo, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = '#FBF9F4';
  ctx.font = "500 30px 'Fraunces', serif";
  ctx.textAlign = 'center';
  ctx.fillText('LM', cx, cyLogo + 10);

  ctx.font = "500 26px 'Fraunces', serif";
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fillText('Le Motivateur', cx, cyLogo + 62);
  ctx.textAlign = 'left';

  // compteur en bas à gauche
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = "600 17px 'Work Sans', sans-serif";
  ctx.fillText(spaced(counterEl.textContent, 2), marginX, H - 44);

  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

shareBtn.addEventListener('click', async () => {
  const original = shareBtn.textContent;
  shareBtn.textContent = 'Préparation…';
  try {
    if (document.fonts && document.fonts.ready) { await document.fonts.ready; }
    const blob = await buildShareImage();
    const fileName = `le-motivateur-${counterEl.textContent.replace(/\D/g,'')}.png`;
    const file = new File([blob], fileName, { type: 'image/png' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: 'Le Motivateur',
        text: quoteEl.textContent,
      });
      shareBtn.textContent = original;
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      shareBtn.textContent = 'Image téléchargée';
      window.setTimeout(() => { shareBtn.textContent = original; }, 1800);
    }
  } catch (e) {
    if (e && e.name === 'AbortError') {
      shareBtn.textContent = original;
    } else {
      shareBtn.textContent = 'Échec, réessaie';
      window.setTimeout(() => { shareBtn.textContent = original; }, 1800);
    }
  }
});
