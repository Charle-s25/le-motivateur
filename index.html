<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Motivateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400;1,9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECE7DC;
    --card:#FBF9F4;
    --ink:#242220;
    --ink-soft:#5B564E;
    --wine:#7A3243;
    --wine-soft:#a9788b;
    --line:#D9D2C2;
  }

  *{ box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(122,50,67,0.05), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(122,50,67,0.06), transparent 50%),
      var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:6vh 5vw;
  }

  header{
    text-align:center;
    margin-bottom:clamp(2.5rem, 6vh, 4rem);
  }

  .eyebrow-top{
    font-size:0.7rem;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--wine);
    margin:0 0 0.9rem;
    font-weight:600;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(2rem, 5vw, 3.2rem);
    margin:0 0 0.6rem;
    letter-spacing:-0.01em;
  }

  .subtitle{
    font-size:0.95rem;
    color:var(--ink-soft);
    max-width:36ch;
    margin:0 auto;
    line-height:1.5;
    font-style:italic;
    font-family:'Fraunces', serif;
  }

  main{
    width:100%;
    max-width:620px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .card{
    position:relative;
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:clamp(2.2rem, 6vw, 3.6rem) clamp(1.8rem, 6vw, 3.2rem) clamp(1.8rem, 5vw, 2.6rem);
    box-shadow:0 1px 2px rgba(36,34,32,0.04), 0 18px 40px -22px rgba(36,34,32,0.35);
    opacity:0;
    transform:translateY(10px);
    transition:opacity 0.55s ease, transform 0.55s ease;
  }

  .card.visible{
    opacity:1;
    transform:translateY(0);
  }

  .card-eyebrow{
    font-size:0.68rem;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--wine);
    font-weight:600;
    margin:0 0 1.4rem;
    display:flex;
    align-items:center;
    gap:0.6rem;
  }

  .card-eyebrow::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }

  .quote-mark{
    font-family:'Fraunces', serif;
    font-size:3rem;
    line-height:0.5;
    color:var(--wine-soft);
    display:block;
    margin-bottom:0.6rem;
    opacity:0.55;
  }

  blockquote{
    margin:0;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.35rem, 3.4vw, 1.75rem);
    line-height:1.42;
    color:var(--ink);
  }

  .attribution{
    margin:1.3rem 0 0;
    font-family:'Work Sans', sans-serif;
    font-size:0.85rem;
    font-weight:500;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }

  .attribution::before{
    content:'— ';
  }

  .divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:1.7rem 0 1.3rem;
  }

  .context-label{
    font-size:0.64rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--wine-soft);
    font-weight:600;
    margin:0 0 0.5rem;
  }

  .context{
    margin:0;
    font-size:0.92rem;
    line-height:1.55;
    color:var(--ink-soft);
    font-style:italic;
  }

  .controls{
    margin-top:2.4rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.9rem;
  }

  button.generate{
    font-family:'Work Sans', sans-serif;
    font-size:0.85rem;
    font-weight:600;
    letter-spacing:0.03em;
    color:var(--card);
    background:var(--ink);
    border:none;
    padding:0.95rem 2.2rem;
    border-radius:2px;
    cursor:pointer;
    transition:background 0.25s ease, transform 0.15s ease;
  }

  button.generate:hover{
    background:var(--wine);
  }

  button.generate:active{
    transform:scale(0.97);
  }

  button.generate:focus-visible{
    outline:2px solid var(--wine);
    outline-offset:3px;
  }

  .counter{
    font-family:'Fraunces', serif;
    font-variant-numeric:tabular-nums;
    font-size:0.78rem;
    color:var(--ink-soft);
    letter-spacing:0.05em;
  }

  .copy-hint{
    font-size:0.72rem;
    color:var(--ink-soft);
    opacity:0.7;
    background:none;
    border:none;
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    padding:0.2rem;
  }

  .copy-hint:focus-visible{
    outline:2px solid var(--wine);
    outline-offset:2px;
  }

  footer{
    margin-top:3rem;
    font-size:0.68rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    opacity:0.55;
  }

  @media (prefers-reduced-motion: reduce){
    .card, html{ transition:none; scroll-behavior:auto; }
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow-top">Cabinet des pensées profondes</p>
  <h1>Le Motivateur</h1>
  <p class="subtitle">De vraies citations. De vrais proverbes. Des circonstances qui, elles, le sont beaucoup moins.</p>
</header>

<main>
  <div class="card" id="card">
    <p class="card-eyebrow" id="category">Citation</p>
    <span class="quote-mark">“</span>
    <blockquote id="quote">Chargement d'une pensée…</blockquote>
    <p class="attribution" id="author">—</p>
    <hr class="divider">
    <p class="context-label">Contexte réel</p>
    <p class="context" id="context">…</p>
  </div>

  <div class="controls">
    <button class="generate" id="generateBtn">Générer une pensée</button>
    <button class="copy-hint" id="copyBtn">Copier cette carte</button>
    <p class="counter" id="counter">Pensée n° 000</p>
  </div>
</main>

<footer>Aucune de ces personnes n'a validé le contexte</footer>

<script>
const THOUGHTS = [
  { cat:"Proverbe", quote:"Petit à petit, l'oiseau fait son nid.", author:"Proverbe français", context:"Dit par un stagiaire après avoir rempli sa troisième case Excel de la journée." },
  { cat:"Proverbe", quote:"L'habit ne fait pas le moine.", author:"Proverbe français", context:"Prononcé en fixant un collègue arrivé en pyjama à la visio de 9h." },
  { cat:"Proverbe", quote:"Qui vole un œuf, vole un bœuf.", author:"Proverbe français", context:"Chuchoté par un client qui vient de piquer une dosette de café en salle de pause." },
  { cat:"Proverbe", quote:"Rome ne s'est pas faite en un jour.", author:"Proverbe", context:"Dit en attendant que la page charge sur le wifi de l'aéroport." },
  { cat:"Proverbe", quote:"Après la pluie, le beau temps.", author:"Proverbe", context:"Dit en sortant de la station de lavage avec la voiture encore sale." },
  { cat:"Proverbe", quote:"Il n'y a pas de fumée sans feu.", author:"Proverbe", context:"Dit en regardant l'alarme incendie du bureau se déclencher à cause du micro-ondes." },
  { cat:"Proverbe", quote:"Mieux vaut tard que jamais.", author:"Proverbe", context:"Envoyé par texto trois heures après le rendez-vous manqué." },
  { cat:"Proverbe", quote:"Qui ne tente rien n'a rien.", author:"Proverbe", context:"Dit juste avant de cliquer sur « acheter maintenant » à deux heures du matin." },
  { cat:"Proverbe", quote:"Chat échaudé craint l'eau froide.", author:"Proverbe", context:"Dit en soufflant longuement sur un yaourt à température ambiante." },
  { cat:"Proverbe", quote:"Pierre qui roule n'amasse pas mousse.", author:"Proverbe", context:"Dit à un collègue qui change d'abonnement de streaming pour la quatrième fois du mois." },
  { cat:"Proverbe", quote:"Tel est pris qui croyait prendre.", author:"Proverbe", context:"Dit en regardant quelqu'un se faire piéger par la porte automatique du supermarché." },
  { cat:"Proverbe", quote:"L'union fait la force.", author:"Proverbe", context:"Dit en poussant à trois une voiture en panne d'essence sur cent mètres." },
  { cat:"Proverbe", quote:"Les cordonniers sont toujours les plus mal chaussés.", author:"Proverbe français", context:"Dit en remarquant que le dentiste du quartier a une dent cassée." },
  { cat:"Proverbe", quote:"Il faut battre le fer tant qu'il est chaud.", author:"Proverbe français", context:"Dit en se ruant sur le dernier croissant avant qu'il refroidisse." },
  { cat:"Proverbe", quote:"Tout ce qui brille n'est pas or.", author:"Proverbe français", context:"Dit en réalisant que la bague à deux euros a verdi le doigt." },
  { cat:"Proverbe", quote:"Vouloir, c'est pouvoir.", author:"Proverbe français", context:"Dit juste avant d'abandonner le montage du meuble en kit." },
  { cat:"Proverbe", quote:"L'exception confirme la règle.", author:"Proverbe français", context:"Dit en justifiant la troisième part de gâteau de la soirée." },
  { cat:"Proverbe", quote:"Aide-toi, le ciel t'aidera.", author:"Proverbe français", context:"Dit en cherchant désespérément le bouton d'assistance du logiciel." },
  { cat:"Proverbe", quote:"Un tiens vaut mieux que deux tu l'auras.", author:"Proverbe français", context:"Dit en refusant d'échanger son siège côté fenêtre contre deux promesses vagues." },
  { cat:"Proverbe", quote:"Il ne faut pas mettre tous ses œufs dans le même panier.", author:"Proverbe français", context:"Dit en répartissant les restes du frigo dans sept boîtes différentes." },
  { cat:"Proverbe", quote:"Les murs ont des oreilles.", author:"Proverbe français", context:"Dit en chuchotant devant la cloison en carton-plâtre du bureau." },
  { cat:"Proverbe", quote:"Charbonnier est maître chez soi.", author:"Proverbe français", context:"Dit en refusant catégoriquement de changer la chaîne de télévision." },
  { cat:"Proverbe", quote:"Ventre affamé n'a pas d'oreilles.", author:"Proverbe français", context:"Dit en zappant une réunion pour foncer à la cantine." },
  { cat:"Proverbe", quote:"Qui sème le vent récolte la tempête.", author:"Proverbe français", context:"Dit après avoir répondu à tout le monde en « répondre à tous » par erreur." },
  { cat:"Proverbe", quote:"Les bons comptes font les bons amis.", author:"Proverbe français", context:"Dit en sortant la calculatrice pour partager une pizza à quatre." },
  { cat:"Proverbe", quote:"Il vaut mieux prévenir que guérir.", author:"Proverbe français", context:"Dit en emportant un parapluie sous un grand soleil." },
  { cat:"Proverbe", quote:"Petit poisson deviendra grand.", author:"Proverbe français", context:"Dit devant un cactus qui n'a toujours pas bougé depuis six mois." },
  { cat:"Proverbe", quote:"On ne peut pas avoir le beurre et l'argent du beurre.", author:"Proverbe français", context:"Dit en réclamant la monnaie ET le sachet gratuit." },
  { cat:"Proverbe", quote:"À bon entendeur, salut.", author:"Proverbe français", context:"Dit en raccrochant au nez d'un démarcheur téléphonique." },
  { cat:"Proverbe", quote:"Loin des yeux, loin du cœur.", author:"Proverbe français", context:"Dit en retrouvant un yaourt tout au fond du frigo, périmé depuis trois semaines." },
  { cat:"Proverbe", quote:"Tout vient à point à qui sait attendre.", author:"Proverbe français", context:"Dit devant le micro-ondes, à quinze secondes de la fin." },
  { cat:"Proverbe", quote:"L'occasion fait le larron.", author:"Proverbe français", context:"Dit en piochant discrètement dans le paquet de bonbons du collègue absent." },
  { cat:"Proverbe", quote:"Qui trop embrasse mal étreint.", author:"Proverbe français", context:"Dit en essayant de refermer huit onglets de navigateur à la fois." },
  { cat:"Proverbe", quote:"Il n'est jamais trop tard pour bien faire.", author:"Proverbe français", context:"Dit en envoyant enfin ses vœux de nouvelle année, le 15 février." },
  { cat:"Proverbe", quote:"Chacun voit midi à sa porte.", author:"Proverbe français", context:"Dit lors d'un débat sur la bonne heure pour manger une raclette." },
  { cat:"Proverbe", quote:"Deux avis valent mieux qu'un.", author:"Proverbe français", context:"Dit en demandant son avis au chat sur le choix du canapé." },
  { cat:"Proverbe", quote:"La nuit porte conseil.", author:"Proverbe français", context:"Dit en repoussant une décision pour la trois centième fois consécutive." },
  { cat:"Proverbe", quote:"Quand le vin est tiré, il faut le boire.", author:"Proverbe français", context:"Dit en terminant un paquet de chips déjà entamé." },
  { cat:"Proverbe", quote:"Qui court deux lièvres à la fois n'en attrape aucun.", author:"Proverbe français", context:"Dit en essayant de répondre à trois messages tout en cuisinant." },
  { cat:"Proverbe", quote:"Il faut savoir donner sa langue au chat.", author:"Proverbe français", context:"Dit après vingt minutes passées sur une grille de sudoku." },
  { cat:"Proverbe", quote:"Tel père, tel fils.", author:"Proverbe français", context:"Dit en surprenant le petit dernier en train de faire la sieste sur le canapé, comme papa." },
  { cat:"Proverbe", quote:"Les grands esprits se rencontrent.", author:"Proverbe français", context:"Dit en découvrant que deux collègues ont commandé exactement le même sandwich." },
  { cat:"Citation motivante", quote:"Le succès, c'est aller d'échec en échec sans perdre son enthousiasme.", author:"Winston Churchill", context:"Dit en apprenant que le distributeur de la salle de pause a encore avalé sa pièce." },
  { cat:"Citation motivante", quote:"La vie, c'est ce qui arrive pendant qu'on fait d'autres projets.", author:"John Lennon", context:"Dit en découvrant que le livreur est passé exactement pendant la douche." },
  { cat:"Citation motivante", quote:"Je n'ai pas échoué. J'ai simplement trouvé dix mille solutions qui ne fonctionnaient pas.", author:"Thomas Edison", context:"Dit en cherchant la télécommande dans les coussins du canapé." },
  { cat:"Citation motivante", quote:"Ce qui ne nous tue pas nous rend plus fort.", author:"Friedrich Nietzsche", context:"Dit en avalant par erreur un piment entier dans la salade." },
  { cat:"Citation motivante", quote:"Il n'y a qu'une façon d'échouer, c'est d'abandonner avant d'avoir réussi.", author:"Georges Clemenceau", context:"Dit à un ami qui relance la manette pour la quatrième partie d'affilée." },
  { cat:"Citation motivante", quote:"Fais de ta vie un rêve, et d'un rêve, une réalité.", author:"Antoine de Saint-Exupéry", context:"Dit en réussissant enfin à régler le réveil sur 7h et pas 7h15." },
  { cat:"Citation motivante", quote:"Le futur appartient à ceux qui croient à la beauté de leurs rêves.", author:"Eleanor Roosevelt", context:"Dit en remplissant un ticket de loto au bureau de tabac." },
  { cat:"Citation motivante", quote:"On ne voit bien qu'avec le cœur.", author:"Antoine de Saint-Exupéry", context:"Dit en cherchant partout ses lunettes, posées sur son front." },
  { cat:"Citation motivante", quote:"Le plus grand risque est de ne prendre aucun risque.", author:"Mark Zuckerberg", context:"Dit en optant pour le supplément fromage sur la pizza." },
  { cat:"Citation motivante", quote:"Le pessimiste voit la difficulté dans chaque opportunité.", author:"Winston Churchill", context:"Dit en regardant la notice de montage d'un meuble en kit." },
  { cat:"Parole de réussite", quote:"Restez affamés, restez fous.", author:"Steve Jobs", context:"Dit devant le frigo ouvert à vingt-trois heures passées." },
  { cat:"Parole de réussite", quote:"Le talent gagne des matchs, mais le travail d'équipe gagne des championnats.", author:"Michael Jordan", context:"Dit pendant une partie de babyfoot acharnée à la pause déjeuner." },
  { cat:"Parole de réussite", quote:"Si vous n'y croyez pas vous-même, personne ne le fera.", author:"Kobe Bryant", context:"Dit en défendant becs et ongles son choix d'ananas sur la pizza." },
  { cat:"Parole de réussite", quote:"Vous ratez cent pour cent des tirs que vous ne tentez pas.", author:"Wayne Gretzky", context:"Dit juste avant de viser la corbeille avec une boulette de papier depuis l'autre bout du bureau." },
  { cat:"Parole de réussite", quote:"Ne cherchez pas à devenir un homme qui a du succès, mais un homme qui a de la valeur.", author:"Albert Einstein", context:"Dit en négociant fermement le prix d'un canapé d'occasion en ligne." },
  { cat:"Parole de réussite", quote:"Le prix du succès, c'est le travail.", author:"Vince Lombardi", context:"Dit en cherchant désespérément un raccourci sur l'application de plan." },
  { cat:"Parole de réussite", quote:"Votre temps est limité, ne le gâchez pas à vivre la vie de quelqu'un d'autre.", author:"Steve Jobs", context:"Dit en refermant enfin les réseaux sociaux après quarante-cinq minutes de défilement." },
  { cat:"Parole de réussite", quote:"L'échec est simplement l'opportunité de recommencer, cette fois plus intelligemment.", author:"Henry Ford", context:"Dit en remontant un meuble en kit pour la deuxième fois." },
  { cat:"Parole de réussite", quote:"Ce sont nos choix qui montrent qui nous sommes vraiment.", author:"J.K. Rowling", context:"Dit debout devant le rayon des chips, un vendredi soir." },
  { cat:"Parole de réussite", quote:"Le succès n'est pas final, l'échec n'est pas fatal, seul compte le courage de continuer.", author:"Winston Churchill", context:"Dit en relançant un niveau de jeu vidéo raté pour la douzième fois." },
];

const card = document.getElementById('card');
const catEl = document.getElementById('category');
const quoteEl = document.getElementById('quote');
const authorEl = document.getElementById('author');
const contextEl = document.getElementById('context');
const counterEl = document.getElementById('counter');
const generateBtn = document.getElementById('generateBtn');
const copyBtn = document.getElementById('copyBtn');

let lastIndex = -1;
let count = 0;

function pad(n){ return String(n).padStart(3, '0'); }

function pickThought(){
  let i;
  do {
    i = Math.floor(Math.random() * THOUGHTS.length);
  } while (i === lastIndex && THOUGHTS.length > 1);
  lastIndex = i;
  return THOUGHTS[i];
}

function render(thought){
  catEl.textContent = thought.cat;
  quoteEl.textContent = thought.quote;
  authorEl.textContent = thought.author;
  contextEl.textContent = thought.context;
  count += 1;
  counterEl.textContent = `Pensée n° ${pad(count)}`;
}

function showNext(){
  const thought = pickThought();
  card.classList.remove('visible');
  window.setTimeout(() => {
    render(thought);
    card.classList.add('visible');
  }, 220);
}

generateBtn.addEventListener('click', showNext);

copyBtn.addEventListener('click', async () => {
  const text = `« ${quoteEl.textContent} »\n— ${authorEl.textContent}\n\nContexte réel : ${contextEl.textContent}`;
  try {
    await navigator.clipboard.writeText(text);
    const original = copyBtn.textContent;
    copyBtn.textContent = 'Copié !';
    window.setTimeout(() => { copyBtn.textContent = original; }, 1600);
  } catch (e) {
    copyBtn.textContent = 'Copie indisponible';
  }
});

// premier affichage
render(pickThought());
requestAnimationFrame(() => card.classList.add('visible'));
</script>

</body>
</html>
